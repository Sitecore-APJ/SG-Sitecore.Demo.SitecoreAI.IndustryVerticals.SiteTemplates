    - ID: "35b07fa2-ce95-4459-8dd6-074203dda9a7"
      Hint: FeatureDescription
      Value: "Taipei, Taiwan, April 22, 2026 — Moxa Inc., a leader in industrial communications and networking, is thrilled to announce that its ioPAC 6500 Series, a next-generation RTU, has won the prestigious Red Dot Award: Product Design 2025. The award recognizes the ioPAC 6500 Series for its innovative design that simplifies complexity in industrial system architectures. The series is positioned as an Intelligent Integrated Node (IIN) and features a modular hardware design that offers exceptional flexibility for system integration and deployment."
