    - ID: "35b07fa2-ce95-4459-8dd6-074203dda9a7"
      Hint: FeatureDescription
      Value: 台北，台湾，2026年4月22日——工业通信和网络领域的领导者Moxa公司欣然宣布，其下一代RTU产品ioPAC 6500系列荣获2025年红点奖：产品设计奖。该奖项表彰了ioPAC 6500系列在简化工业系统架构复杂性方面的创新设计。该系列定位为智能集成节点（IIN），并采用模块化硬件设计，为系统集成和部署提供了卓越的灵活性。
