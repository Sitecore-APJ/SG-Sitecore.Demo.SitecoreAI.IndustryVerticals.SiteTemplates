      Hint: Content
      Value: |
        <figure class="table"><table><tbody><tr><td><strong>Pass type</strong></td><td><strong>Who is it for</strong></td></tr><tr><td><a href="https://www.mom.gov.sg/employment-practices" target="_blank" title="Employment Pass">Employment Pass</a></td><td>For foreign professionals, managers, executives and technicians. Candidates need to earn at least $5,600 a month and pass the Complementarity Assessment Framework (COMPASS).</td></tr><tr><td><a href="~/link.aspx?_id=F0CA896A5BF94B09A74AC57E63116D4C&amp;_z=z" target="_blank" title="EntrePass">EntrePass</a></td><td>For foreign entrepreneurs who are keen to start and operate a business in Singapore that is venture-backed or possesses innovative technologies.</td></tr><tr><td>Personalised Employment Pass</td><td>For high-earning existing Employment Pass holders or overseas foreign professionals. The PEP offers greater flexibility than an Employment Pass.</td></tr><tr><td>Overseas Networks &amp; Expertise Pass</td><td>For top talent in business, arts and culture, sports, as well as academia and research.</td></tr></tbody></table></figure>
