    - ID: "4fc0c7b3-bcfb-4a9d-834d-59f6836e5fd6"
      Hint: PromoDescription
      Value: |
        <div class="ck-content"><p>The salary requirements for Employment Pass (EP) applications have been updated. The minimum qualifying salary has increased, and new salary thresholds now apply based on an applicant’s level of experience.<br /><br /><strong>Salary criteria based on experience</strong></p><p>Under the updated framework, salary requirements are more closely aligned with experience:</p><ul style="list-style-type:disc;"><li style="tab-stops:list 36.0pt;"><strong>Entry-level professionals</strong><br />Must meet the updated minimum salary of <strong>SGD 6,000</strong></li><li style="tab-stops:list 36.0pt;"><strong>Mid-level professionals</strong><br />Higher salary thresholds apply based on years of relevant experience&nbsp;</li><li style="tab-stops:list 36.0pt;"><p><strong>Senior professionals</strong><br />Significantly higher salary expectations reflecting leadership and expertise&nbsp;<br />&nbsp;</p><p><strong>How this affects your application</strong></p><p>If you are applying for an Employment Pass:</p></li><li style="tab-stops:list 36.0pt;">You must meet the <strong>updated salary threshold based on your experience level</strong></li><li style="tab-stops:list 36.0pt;">Applications will be assessed using the <strong>revised salary criteria</strong>&nbsp;</li><li style="tab-stops:list 36.0pt;"><p>Ensure all submitted information reflects the latest requirements&nbsp;</p><p><strong>How to apply</strong></p></li><li style="tab-stops:list 36.0pt;"><strong>Check your eligibility</strong><br />Review the updated salary criteria based on your experience</li><li style="tab-stops:list 36.0pt;"><strong>Prepare your documents</strong><br />Ensure your qualifications and employment history are accurate</li><li style="tab-stops:list 36.0pt;"><strong>Submit your application</strong><br />Apply through the official MOM portal</li><li style="tab-stops:list 36.0pt;"><strong>Application processing</strong><br />Applications will be assessed based on updated criteria&nbsp;</li></ul><p><span style="font-family:&quot;Aptos&quot;,sans-serif;font-size:12.0pt;line-height:115%;"><strong>Receive outcome</strong></span><br /><span style="font-family:&quot;Aptos&quot;,sans-serif;font-size:12.0pt;line-height:115%;">You will be notified once a decision has been made&nbsp;</span></p></div>
