      Hint: Content
      Value: |
        <section aria-label="Summary">
          <p><strong>Summary:</strong> The minimum qualifying salary has increased. Salary thresholds are now more structured by relevant experience and sector.</p>
        </section>
        
        <section>
          <h2>Current vs Updated Salary Criteria</h2>
          <table>
            <thead>
              <tr>
                <th scope="col">Criteria</th>
                <th scope="col">Current (Before 2027)</th>
                <th scope="col">Updated (From 2027)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">Minimum salary (most sectors)</th>
                <td>SGD 5,600</td>
                <td>SGD 6,000</td>
              </tr>
              <tr>
                <th scope="row">Financial services sector</th>
                <td>SGD 6,200</td>
                <td>SGD 6,600</td>
              </tr>
              <tr>
                <th scope="row">Salary progression with experience</th>
                <td>Gradual increase</td>
                <td>More structured and higher thresholds</td>
              </tr>
              <tr>
                <th scope="row">Senior professionals</th>
                <td>~SGD 10,700+</td>
                <td>~SGD 11,500+ and above</td>
              </tr>
            </tbody>
          </table>
        </section>
        
        <section>
          <h2>Salary criteria based on experience</h2>
          <ul>
            <li><strong>Entry-level professionals:</strong> Must meet the updated minimum salary of <strong>SGD 6,000</strong> (most sectors).</li>
            <li><strong>Mid-level professionals:</strong> Higher thresholds apply based on years of relevant experience.</li>
            <li><strong>Senior professionals:</strong> Significantly higher salary expectations reflecting leadership and expertise.</li>
          </ul>
        </section>
        
        <section>
          <h2>How this affects your application</h2>
          <ul>
            <li>You must meet the updated salary threshold based on your experience level and sector.</li>
            <li>Applications will be assessed using the revised salary criteria.</li>
            <li>Ensure all submitted information reflects the latest requirements.</li>
          </ul>
        </section>
        
        <section>
          <h2>How to apply</h2>
          <ol>
            <li><strong>Check your eligibility:</strong> Review the updated salary criteria based on your experience.</li>
            <li><strong>Prepare your documents:</strong> Ensure your qualifications and employment history are accurate.</li>
            <li><strong>Submit your application:</strong> Apply through the official MOM portal.</li>
            <li><strong>Application processing:</strong> Applications will be assessed based on updated criteria.</li>
            <li><strong>Receive outcome:</strong> You will be notified once a decision has been made.</li>
          </ol>
          <p><a href="#">Check your eligibility</a> | <a href="#">Apply on MOM portal</a></p>
          <p><small>Links are placeholders. Replace with official URLs before publishing.</small></p>
        </section>
        
        <section>
          <h2>Important notice</h2>
          <ul>
            <li>The updated salary criteria apply to all new Employment Pass applications submitted from the effective date in 2027.</li>
            <li>Applications submitted before the effective date will be assessed based on the previous criteria.</li>
          </ul>
        </section>
