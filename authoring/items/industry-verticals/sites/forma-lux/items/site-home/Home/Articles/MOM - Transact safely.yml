      Hint: Content
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;box-sizing:border-box;color:rgb(12, 13, 13);font-family:&quot;Open Sans&quot;, Lato, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.5rem;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Scams could be in the form of unexpected phone calls or emails claiming to be from MOM. They may also ask for money, sensitive information or confidential personal information.</p><p><br /><strong>How to identify phone or email scams</strong></p><p style="-webkit-text-stroke-width:0px;box-sizing:border-box;color:rgb(12, 13, 13);font-family:&quot;Open Sans&quot;, Lato, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.5rem;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">You may be able to spot some of these signs and avoid being a victim:</p><ul style="-webkit-text-stroke-width:0px;box-sizing:border-box;color:rgb(12, 13, 13);font-family:&quot;Open Sans&quot;, Lato, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;list-style-type:disc;margin-bottom:1.00001rem;margin-right:0px;margin-top:-0.75rem;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><li style="box-sizing:border-box;margin-bottom:0.4995rem;"><p style="margin-left:2em;">The caller or sender is unable to identify themselves properly.</p></li><li style="box-sizing:border-box;margin-bottom:0.4995rem;"><p style="margin-left:2em;">You are not expecting an SMS, call or email from MOM.</p></li><li style="box-sizing:border-box;margin-bottom:0.4995rem;"><p style="margin-left:2em;">You are not aware of the transaction or interaction which is being referenced during the correspondence or conversation.</p></li></ul></div>
