      Hint: Content
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;box-sizing:border-box;color:rgb(12, 13, 13);font-family:&quot;Open Sans&quot;, Lato, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.5rem;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">MOM will continue to walk with workers and businesses, so that <strong style="box-sizing:border-box;">every worker can realise their potential and achieve their career aspirations, and every business can thrive by bringing out the best in their people</strong>.</p><p style="-webkit-text-stroke-width:0px;box-sizing:border-box;color:rgb(12, 13, 13);font-family:&quot;Open Sans&quot;, Lato, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.5rem;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Together with our tripartite partners, we will empower Singaporeans to build meaningful careers, enable businesses to transform and provide quality jobs; and build more inclusive workplaces that leave no one behind.</p></div>
