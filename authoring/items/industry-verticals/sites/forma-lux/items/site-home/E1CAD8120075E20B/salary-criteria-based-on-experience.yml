        <h2 id="experience">Salary criteria based on experience</h2><ul><li><strong>Entry-level professionals:</strong> Must meet the updated minimum salary of <strong>SGD 6,000</strong> (most sectors).</li><li><strong>Mid-level professionals:</strong> Higher thresholds apply based on years of relevant experience.</li><li><strong>Senior professionals:</strong> Significantly higher salary expectations reflecting leadership and expertise.</li></ul>
